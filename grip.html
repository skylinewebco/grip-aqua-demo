<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GRIP — Smart Hydration</title>
  <meta name="description" content="GRIP — a cinematic 3D smart-hydration product experience built with React Three Fiber, three.js, drei & GSAP." />
  <!-- apply saved theme before paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("grip-theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b8ff2e'/%3E%3Ctext x='16' y='23' font-size='16' font-weight='800' text-anchor='middle' fill='%230a0b0d' font-family='Arial'%3EG%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/grip/grip.css" />
</head>
<body>
  <div id="grip-root"></div>
  <script type="module" src="/src/grip/main.jsx"></script>
</body>
</html>
